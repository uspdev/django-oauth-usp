[project]
name = "django-oauth-usp"
version = "2.1.1"
description = "Login com a Senha Única USP (OAuth) para projetos Django."
authors = [{ name = "Marcelo Schneider", email = "schenider.fei@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "authlib>=1.3.1",
    "django>=4.2",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "coverage>=7.2",
    "faker>=18.11",
    "httpretty>=1.1.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
