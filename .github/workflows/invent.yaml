name: Invent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  issues:
    types:
      - opened

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          # Versões mínimas declaradas no pyproject (Django 4.2, Authlib 1.3.1).
          - python-version: "3.10"
            resolution: lowest-direct

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run Tests
      run: uv run --isolated --resolution ${{ matrix.resolution }} python manage.py test
